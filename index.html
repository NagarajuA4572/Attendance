<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Monitoring</title>
    <link rel="stylesheet" href="attendance.css">
</head>
<body>
    <center>
        <h1>Class Attendance</h1>
    </center>
    <label>Enter class strength: </label>
    <input type="number" id="num">
    <br>
    <input type="radio" name="typelist" value="present">
    Enter Presenties <br>
    <input type="radio" name="typelist" value="absent">
    Enter Absentees
    <button onclick="createtable()">✔</button>
    <div id="tableArea"></div>
    <br>
    <label>Roll No: </label>
    <input type="number" id="val" onkeydown="handleAddEnter(event)">
    <button onclick="addValue()">✔</button><br>
    <label>Remove No: </label>
    <input type="number" id="remval" onkeydown="handleRemEnter(event)">
    <button onclick="remValue()">✔</button>
    <br><br>
    <input
        type="radio"
        name="attendance"
        value="present"
        onchange="finalList()"
    >
    Generate Presenties list
    <br>
    <input
        type="radio"
        name="attendance"
        value="absent"
        onchange="finalList()"
    >
    Generate Absentees List
    <br>
    <div id="textArea"></div>
    <p id="toast"></p>
    <script src="attendance.js"></script>
</body>
</html>
